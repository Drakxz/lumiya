# Instale no host. Emita um certificado válido antes de ativar o bloco TLS.
server {
    listen 80;
    server_name fotos.exemplo.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name fotos.exemplo.com;
    ssl_certificate /etc/letsencrypt/live/fotos.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fotos.exemplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sobrescreve (não concatena) cabeçalhos fornecidos por visitantes.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
