name: SLAFotos
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    DISCORD_CLIENT_ID: "1569908118698332191"
    SITE_URL: "https://3.12.169.220.nip.io"
targets:
  SLAFotos:
    type: application
    platform: iOS
    sources:
      - path: SLAFotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sla.fotos
        INFOPLIST_FILE: SLAFotos/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: SLAFotos/SLAFotos-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../sdk/include"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: ../sdk/ios/discord_partner_sdk.xcframework
        embed: true
        codeSign: true
